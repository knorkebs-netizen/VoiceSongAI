name: Build VoiceSong AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android SDK 35 installieren
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android-Projekt entpacken
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q VoiceSongAI-v0.3.zip -d build-project

      - name: APK bauen
        working-directory: build-project/VoiceSongAI
        run: gradle assembleDebug --stacktrace

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: VoiceSongAI-debug
          path: build-project/VoiceSongAI/app/build/outputs/apk/debug/app-debug.apk
