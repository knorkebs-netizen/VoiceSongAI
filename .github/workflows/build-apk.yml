name: Build VoiceSong AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Android-Projekt entpacken
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q VoiceSongAI-v0.3-1.zip -d build-project

      - name: Android-Projekt finden
        run: |
          PROJECT_DIR=$(dirname "$(find build-project -name settings.gradle.kts -o -name settings.gradle | head -1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projekt gefunden: $PROJECT_DIR"

      - name: AndroidX aktivieren
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if grep -q '^android.useAndroidX=' gradle.properties 2>/dev/null; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' gradle.properties
          else
            echo 'android.useAndroidX=true' >> gradle.properties
          fi

          if grep -q '^android.enableJetifier=' gradle.properties 2>/dev/null; then
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' gradle.properties
          else
            echo 'android.enableJetifier=true' >> gradle.properties
          fi

      - name: APK bauen
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace -Pkotlin.jvm.target.validation.mode=warning

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: VoiceSongAI-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
